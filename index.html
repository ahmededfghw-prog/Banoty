<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالمنا الخاص ❤️✨</title>
    <style>
        :root {
            --bg-color: #fff0f5;
            --primary-color: #ff4d6d;
            --card-bg: #ffffff;
            --text-color: #590d22;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 1. شاشة كلمة السر */
        #lock-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .lock-box {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            max-width: 350px;
            width: 100%;
        }

        .lock-box h2 { margin-bottom: 15px; font-size: 1.5rem; }

        .lock-box input {
            width: 100%;
            padding: 12px;
            border-radius: 25px;
            border: none;
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 15px;
            outline: none;
        }

        .lock-box button {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(255, 77, 109, 0.4);
        }

        /* 2. تساقط القلوب والفراشات */
        .heart, .butterfly {
            position: fixed;
            top: -10vh;
            font-size: 1.5rem;
            user-select: none;
            pointer-events: none;
            animation: fall 6s linear infinite;
            z-index: 100;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        /* 3. محتوى الموقع الرئيسي */
        #main-content {
            display: none;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin: 20px 0 30px 0;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        /* مشغل الصوت */
        .audio-container {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.15);
            text-align: center;
            margin-bottom: 30px;
        }

        audio { width: 100%; max-width: 400px; height: 35px; }

        /* معرض الصور */
        .gallery-title {
            text-align: center;
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        .photo-card {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            transition: 0.3s;
        }

        .photo-card:hover { transform: translateY(-5px); }

        .photo-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
        }

        /* صندوق إرسال الرسائل */
        .message-box {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(255, 77, 109, 0.12);
            text-align: center;
            margin-bottom: 30px;
        }

        .message-box h2 {
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #ffccd5;
            font-size: 1rem;
            outline: none;
            resize: none;
            margin-bottom: 15px;
        }

        textarea:focus { border-color: var(--primary-color); }

        .send-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3);
        }

        .send-btn:hover { opacity: 0.9; }

        footer { text-align: center; font-size: 0.9rem; color: #a4133c; padding: 20px 0; }
    </style>
</head>
<body>

    <!-- 🔒 شاشة الحماية بكلمة السر -->
    <div id="lock-screen">
        <div class="lock-box">
            <h2>🔒 عالمنا الخاص</h2>
            <p style="margin-bottom: 15px; font-size: 0.9rem;">أدخلي كلمة السر لفتح المفاجأة ❤️</p>
            <input type="password" id="pass-input" placeholder="كلمة السر...">
            <button onclick="checkPassword()">دخول ✨</button>
            <p id="error-msg" style="color: #fff; margin-top: 10px; font-size: 0.85rem; display: none;">كلمة السر خاطئة! ❌</p>
        </div>
    </div>

    <!-- 💖 المحتوى الرئيسي للموقع -->
    <div id="main-content">
        
        <header>
            <h1>أجمل ذكرياتنا سوا ❤️✨</h1>
            <p>مكاننا الخاص للذكريات والرسائل الجميلة</p>
        </header>

        <!-- مشغل الأغنية -->
        <div class="audio-container">
            <p style="margin-bottom: 8px; font-weight: bold; color: #ff4d6d;">🎵 أغنيتنا المفضلة:</p>
            <!-- يمكنك وضع رابط أغنيتك أو إبقاء اسم الملف song.mp3 -->
            <audio id="love-song" controls autoplay loop>
                <source src="song.mp3" type="audio/mpeg">
                متصفحك لا يدعم مشغل الصوت.
            </audio>
        </div>

        <!-- معرض الصور -->
        <h2 class="gallery-title">📸 صورنا الذكرية</h2>
        <div class="gallery-grid">
            <div class="photo-card">
                <img src="love1.jpg" alt="صورة 1" onerror="this.src='3.JPG'">
            </div>
            <div class="photo-card">
                <img src="love2.jpg" alt="صورة 2" onerror="this.src='4.JPG'">
            </div>
            <div class="photo-card">
                <img src="love3.jpg" alt="صورة 3" onerror="this.src='6.JPG'">
            </div>
        </div>

        <!-- صندوق إرسال الرسائل بتلجرام -->
        <div class="message-box">
            <h2>💌 اكتبيلي رسالة</h2>
            <p style="color: #800f2f; margin-bottom: 15px; font-size: 0.9rem;">أي رسالة تكتبيها هنا هتوصلي على التلجرام فوراً ❤️</p>
            <form id="love-form">
                <textarea id="love-message" rows="4" placeholder="اكتبي كل اللي في قلبك..." required></textarea>
                <button type="submit" class="send-btn">إرسال الرسالة 🚀</button>
            </form>
        </div>

        <footer>صُنع بحب من أجلكِ فقط 💖</footer>
    </div>

    <script>
        // 🔑 1. التحقق من كلمة السر (يمكنك تغيير "1234" لأي كلمة سر تريدها)
        const SECRET_PASS = "1234";

        function checkPassword() {
            const input = document.getElementById('pass-input').value;
            if (input === SECRET_PASS) {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                
                // تشغيل الأغنية والقلوب عند الدخول
                document.getElementById('love-song').play().catch(() => {});
                startEffects();
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        // 🦋 2. توليد تساقط القلوب والفراشات
        function startEffects() {
            const icons = ['❤️', '💖', '🦋', '✨', '🌸'];
            setInterval(() => {
                const item = document.createElement('div');
                item.classList.add('heart');
                item.innerText = icons[Math.floor(Math.random() * icons.length)];
                item.style.left = Math.random() * 100 + 'vw';
                item.style.animationDuration = (Math.random() * 3 + 3) + 's';
                document.body.appendChild(item);

                setTimeout(() => item.remove(), 6000);
            }, 400);
        }

        // 📬 3. إرسال الرسالة مباشرة إلى حسابك في تلجرام
        document.getElementById('love-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const msg = document.getElementById('love-message').value;

            const botToken = "8624749284:AAEMvDKtk_N5QR0Iiq3E2DTo5ErKb_dt0fM";
            const chatId = "1658368856";

            const text = `💌 رسالة حب جديدة من الموقع:\n\n"${msg}"`;
            const url = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(text)}`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data.ok) {
                        alert("وصلتني رسالتك يا حبيبتي! ❤️✨");
                        document.getElementById('love-message').value = '';
                    } else {
                        alert("حدث خطأ بسيط في الإرسال.");
                    }
                })
                .catch(() => alert("تعذر الاتصال بالشبكة."));
        });
    </script>
</body>
</html>
