<script>
function scanAndLoadFolderMedia() {
    const container = document.getElementById('media-grid-container');
    container.innerHTML = "";

    discoveredImages = [];

    /*
      ============================
      الصور داخل مجلد imeges
      ============================
    */

    const imageExtensions = [
        'jpg', 'jpeg', 'png', 'webp', 'gif',
        'JPG', 'JPEG', 'PNG', 'WEBP', 'GIF'
    ];

    for (let i = 1; i <= 200; i++) {
        imageExtensions.forEach(ext => {
            testAndAddMedia(`imeges/ph${i}.${ext}`, 'image');
        });
    }

    /*
      ============================
      الفيديوهات خارج imeges
      بجانب index.html
      ============================
    */

    const videoExtensions = [
        'mp4', 'MP4',
        'webm', 'WEBM',
        'mov', 'MOV',
        'ogg', 'OGG',
        'm4v', 'M4V'
    ];

    for (let i = 1; i <= 200; i++) {
        videoExtensions.forEach(ext => {
            testAndAddMedia(`v${i}.${ext}`, 'video');
        });
    }

    /*
      ============================
      فيديوهات بأسماء مختلفة
      لو عندك مثلاً:
      video.mp4
      video2.MP4
      love.MP4
      ============================
    */

    const extraVideos = [
        'video.mp4',
        'video.MP4',
        'video1.mp4',
        'video1.MP4',
        'video2.mp4',
        'video2.MP4',
        'love.mp4',
        'love.MP4'
    ];

    extraVideos.forEach(file => {
        testAndAddMedia(file, 'video');
    });
}


function testAndAddMedia(url, type) {

    const container = document.getElementById('media-grid-container');

    /*
      ============================
      اختبار الصور
      ============================
    */

    if (type === 'image') {

        const img = new Image();

        img.onload = function() {

            /*
              منع تكرار الصورة
            */

            if (discoveredImages.includes(url)) {
                return;
            }

            discoveredImages.push(url);

            /*
              أول صورة تصبح خلفية
            */

            if (discoveredImages.length === 1) {

                document.body.style.backgroundImage =
                    `url("${url}")`;

                startBackgroundCycler();
            }

            /*
              تحديث شريط الذكريات
            */

            updateTopSlideshow();

            /*
              إنشاء بطاقة الصورة
            */

            const card = document.createElement('div');

            card.className = 'media-card';

            card.innerHTML = `
                <div class="media-love-text">
                    <span>💜</span>
                    <span>
                        ${getRandomCaption()}
                    </span>
                    <span>💜</span>
                </div>

                <img
                    src="${url}"
                    alt="ذكرى جميلة"
                    loading="lazy"
                    onclick="changeSiteBackground('${url}')"
                >

                <div class="photo-heart">
                    ❤️ بسبوستى وبنوتى وحبيبتى ❤️
                </div>
            `;

            container.appendChild(card);
        };

        img.onerror = function() {
            // الملف غير موجود، نتجاهله
        };

        img.src = url;
    }


    /*
      ============================
      اختبار الفيديوهات
      ============================
    */

    else if (type === 'video') {

        const video = document.createElement('video');

        video.preload = 'metadata';

        video.onloadedmetadata = function() {

            /*
              منع تكرار الفيديو
            */

            if (
                [...container.querySelectorAll('video')]
                .some(v => v.dataset.src === url)
            ) {
                return;
            }

            const card = document.createElement('div');

            card.className = 'media-card video-card';

            card.innerHTML = `
                <div class="media-love-text">
                    <span>🎬</span>
                    <span>
                        لحظة من أجمل لحظاتنا يا بسبوستى،
                        كل ثانية في الفيديو ده بتفكرني
                        قد إيه وجودك في حياتي نعمة ❤️
                    </span>
                    <span>🎬</span>
                </div>

                <video
                    controls
                    playsinline
                    preload="metadata"
                    data-src="${url}"
                    src="${url}"
                ></video>

                <div class="photo-heart">
                    💕 بنوتى الجميلة وحبيبتى وروح قلبى 💕
                </div>
            `;

            container.appendChild(card);
        };

        video.onerror = function() {
            // الملف غير موجود أو الامتداد غير مدعوم
        };

        video.src = url;
    }
}


/*
  تغيير خلفية الموقع عند الضغط على صورة
*/

function changeSiteBackground(url) {

    document.body.style.backgroundImage =
        `url("${url}")`;
}


/*
  تشغيل شريط الخلفية
*/

function startBackgroundCycler() {

    if (discoveredImages.length <= 1) {
        return;
    }

    setInterval(() => {

        currentBgIndex =
            (currentBgIndex + 1) %
            discoveredImages.length;

        document.body.style.backgroundImage =
            `url("${discoveredImages[currentBgIndex]}")`;

    }, 10000);
}
</script>
